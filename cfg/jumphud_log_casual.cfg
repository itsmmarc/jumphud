alias "jh_casual_off"   "jh_speedos_off; jh_mmdashboard_casual_clear; jh_mmoverride_casual_clear; jh_ammo_casual_clear; jh_killstreak_casual_clear; jh_classmenu_casual_clear; jh_teammenu_casual_clear; jh_scoreboard_casual_clear; jh_mangler_casual_clear; jh_uber_casual_clear; jh_health_casual_clear; jh_hudlayout_casual_clear; jh_demopipes_casual_clear; jh_targetid_casual_clear;"
alias "jh_casual_on"    "jh_speedos_off; jh_mmdashboard_casual; jh_mmoverride_casual; jh_ammo_casual; jh_killstreak_casual; jh_classmenu_casual; jh_teammenu_casual; jh_scoreboard_casual; jh_mangler_casual; jh_uber_casual; jh_health_casual; jh_hudlayout_casual; jh_demopipes_casual; jh_targetid_casual;"