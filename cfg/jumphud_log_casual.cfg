alias "jh_teammenu_casual_clear"        "sixense_clear_bindings; sixense_write_bindings jumphud/jh_teammenu_casual.txt"
alias "jh_scoreboard_casual_clear"      "sixense_clear_bindings; sixense_write_bindings jumphud/jh_scoreboard_casual.txt"
alias "jh_mangler_casual_clear"         "sixense_clear_bindings; sixense_write_bindings jumphud/jh_mangler_casual.txt"
