// casual on
alias "jh_mmdashboard_casual"           "jh_mmdashboard_casual_clear; con_logfile cfg/jumphud/jh_mmdashboard_casual.txt; echo #base ../../custom/jumphud/resource/ui/matchmakingdashboard_casual.res; console_unlog"
