//======================================================================================================================================================================================================================
// CASUAL MODE
//======================================================================================================================================================================================================================
// casual off
alias "jh_mmoverride_casual_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_mmoverride_casual.txt"

// casual on
alias "jh_mmoverride_casual"				"jh_mmoverride_casual_clear; con_logfile cfg/jumphud/jh_mmoverride_casual.txt; echo #base ../../custom/jumphud/resource/ui/mainmenuoverride_casual.res; console_unlog"

// toggle
alias "jh_casual_on"	    				"jh_mmoverride_casual;"
alias "jh_casual_off"	           			"jh_mmoverride_casual_clear;"