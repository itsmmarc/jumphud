// matchmaking dashboard
alias matchmakingdashboard_clear "sixense_clear_bindings; sixense_write_bindings hud_matchmakingdashboard.txt"
alias matchmakingdashboard_log "con_filter_text #base; con_filter_enable 1; con_logfile cfg/hud_matchmakingdashboard.txt"
alias matchmakingdashboard_unlog "con_logfile console.log"

alias matchmakingdashboard_casual "matchmakingdashboard_clear; matchmakingdashboard_log; exec hud/matchmakingdashboard_casual.cfg; matchmakingdashboard_unlog;"
alias matchmakingdashboard_jump "matchmakingdashboard_clear;"

// reserve ammo
alias hudammoweapons_clear "sixense_clear_bindings; sixense_write_bindings hud_hudammoweapons.txt"
alias hudammoweapons_log "con_filter_text #base; con_filter_enable 1; con_logfile cfg/hud_hudammoweapons.txt"
alias hudammoweapons_unlog "con_logfile console.log"

alias hudammoweapons_casual "hudammoweapons_clear; hudammoweapons_log; exec hud/hudammoweapons_casual.cfg; hudammoweapons_unlog;"
alias hudammoweapons_jump "hudammoweapons_clear;"

// main toggle alias
alias casualtoggle casualtoggleon;
alias casualtoggleon  "matchmakingdashboard_casual; hudammoweapons_casual; alias casualtoggle casualtoggleoff";
alias casualtoggleoff "matchmakingdashboard_jump; hudammoweapons_jump alias casualtoggle casualtoggleon";