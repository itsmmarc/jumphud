// main toggle alias
alias casualtoggle casualtoggleon;
alias casualtoggleon  "matchmakingdashboard_casual; hudammoweapons_casual; mainmenuoverride_casual; Killstreak_Counter_casual; classselection_casual; teammenu_casual; scoreboard_casual; mangler_casual; hudmediccharge_casual; alias casualtoggle casualtoggleoff";
alias casualtoggleoff "matchmakingdashboard_jump; hudammoweapons_jump; mainmenuoverride_jump; Killstreak_Counter_jump; classselection_jump; teammenu_jump; scoreboard_jump; mangler_jump; hudmediccharge_jump; alias casualtoggle casualtoggleon";