//======================================================================================================================================================================================================================
// BUBBLES STYLE
//======================================================================================================================================================================================================================
alias "jh_bubbles_clear"    "sixense_clear_bindings; sixense_write_bindings jumphud/jh_bubbles.txt;"
alias "jh_bubbles_log"	    "con_logfile cfg/jumphud/jh_bubbles.txt"

alias "jh_bubbles_default"      "jh_bubbles_clear;"
alias "jh_bubbles_blank"   	    "jh_bubbles_clear; jh_bubbles_log; echo #base; echo ../../custom/jumphud/materials/vgui/replay/thumbnails/blank.vmt; console_unlog"

