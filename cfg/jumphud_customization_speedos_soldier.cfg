alias "jh_speedo_s_shadows_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedo_s_shadows.txt"

alias "jh_speedo_s_shadows_on"				"jh_speedo_s_shadows_clear;"
