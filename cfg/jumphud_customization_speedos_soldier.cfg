alias "jh_speedo_s_shadows_off_res6"        "echo slot_2_container{; jh_speedo_s_shadows_off_res7"
alias "jh_speedo_s_shadows_off_res7"        "echo shadows_container{; jh_speedo_s_shadows_off_res8"
alias "jh_speedo_s_shadows_off_res8"        "echo visible 0}}; jh_speedo_s_shadows_off_res9"

alias "jh_speedo_s_shadows_off_res9"        "echo slot_3_container{; jh_speedo_s_shadows_off_res10"
alias "jh_speedo_s_shadows_off_res10"        "echo shadows_container{; jh_speedo_s_shadows_off_res11"
alias "jh_speedo_s_shadows_off_res11"        "echo visible 0}}; jh_speedo_s_shadows_off_res12"

alias "jh_speedo_s_shadows_off_res12"        "echo slot_4_container{; jh_speedo_s_shadows_off_res13"
alias "jh_speedo_s_shadows_off_res13"        "echo shadows_container{; jh_speedo_s_shadows_off_res14"
alias "jh_speedo_s_shadows_off_res14"        "echo visible 0}}}}"

