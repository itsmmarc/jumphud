alias "jh_speedo_s_shadows_off"				"jh_speedo_s_shadows_clear; con_logfile cfg/jumphud/jh_speedo_s_shadows.txt; jh_speedo_s_shadows_off_res; console_unlog"
alias "jh_speedo_s_shadows_off_res"         "echo x{; jh_speedo_s_shadows_off_res2"
alias "jh_speedo_s_shadows_off_res2"        "echo speedos{; jh_speedo_s_shadows_off_res3"

alias "jh_speedo_s_shadows_off_res3"        "echo slot_1_container{; jh_speedo_s_shadows_off_res4"
alias "jh_speedo_s_shadows_off_res4"        "echo shadows_container{; jh_speedo_s_shadows_off_res5"
