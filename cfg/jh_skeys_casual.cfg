// NULL SKEYS
// Null-Canceling Movement script
// Prevents you from pressing two opposing directions, which causes you to stop moving

alias "+jh_null_forward"    "+jhc_null_forward"  
alias "+jh_null_back"       "+jhc_null_back"     
alias "+jh_null_moveleft"   "+jhc_null_moveleft" 
alias "+jh_null_moveright"  "+jhc_null_moveright"
alias "-jh_null_forward"    "-jhc_null_forward"  
alias "-jh_null_back"       "-jhc_null_back"     
alias "-jh_null_moveleft"   "-jhc_null_moveleft" 
alias "-jh_null_moveright"  "-jhc_null_moveright"

