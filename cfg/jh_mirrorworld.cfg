exec jh_shaders.cfg
jh_mirror_on
hud_reloadscheme

m_yaw -0.022

alias "+jh_moveleft"    "+jhj_moveright"
alias "-jh_moveleft"    "-jhj_moveright"
alias "+jh_moveright"   "+jhj_moveleft"
alias "-jh_moveright"   "-jhj_moveleft"

alias "+jh_null_moveleft"   "+jhj_null_moveright" 
alias "-jh_null_moveleft"   "-jhj_null_moveright" 
alias "+jh_null_moveright"  "+jhj_null_moveleft"
alias "-jh_null_moveright"  "-jhj_null_moveleft"

// TEB
alias +jh_teb "+strafe; m_yaw -0.0001; m_pitch 0.0001"
alias -jh_teb "-strafe; m_yaw -0.022; m_pitch 0.022"