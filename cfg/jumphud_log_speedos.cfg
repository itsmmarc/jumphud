//======================================================================================================================================================================================================================
// SOLDIER SPEEDO
//======================================================================================================================================================================================================================
// off
alias "jh_speedo_soldier_on"         "sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedo_soldier.txt"

// on
alias "jh_speedo_soldier_off"           "jh_speedo_soldier_on; con_logfile cfg/jumphud/jh_speedo_soldier.txt; echo #base ../../custom/jumphud/resource/ui/speedo_soldier_off.res; console_unlog"

// toggle (also turns demo off when toggling on)
alias jh_speedo_soldier_toggle jh_speedo_soldier_toggle_on;
alias jh_speedo_soldier_toggle_on "jh_speedo_soldier_on; alias jh_speedo_soldier_toggle jh_speedo_soldier_toggle_off; jh_speedo_demo_toggle_off"
alias jh_speedo_soldier_toggle_off "jh_speedo_soldier_off; alias jh_speedo_soldier_toggle jh_speedo_soldier_toggle_on"

//======================================================================================================================================================================================================================
// DEMO SPEEDO
//======================================================================================================================================================================================================================
// off
alias "jh_speedo_demo_on"         "sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedo_demo.txt"

// on
alias "jh_speedo_demo_off"           "jh_speedo_demo_on; con_logfile cfg/jumphud/jh_speedo_demo.txt; echo #base ../../custom/jumphud/resource/ui/speedo_demo_off.res; console_unlog"

// toggle (also turns soldier off when toggling on)
alias jh_speedo_demo_toggle jh_speedo_demo_toggle_on;
alias jh_speedo_demo_toggle_on "jh_speedo_demo_on; alias jh_speedo_demo_toggle jh_speedo_demo_toggle_off; jh_speedo_soldier_toggle_off"
alias jh_speedo_demo_toggle_off "jh_speedo_demo_off; alias jh_speedo_demo_toggle jh_speedo_demo_toggle_on"

//======================================================================================================================================================================================================================
// ABSOLUTE SPEEDO
//======================================================================================================================================================================================================================
// off
alias "jh_speedo_absolute_on"         "sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedo_absolute.txt"

// on
alias "jh_speedo_absolute_off"           "jh_speedo_absolute_on; con_logfile cfg/jumphud/jh_speedo_absolute.txt; echo #base ../../custom/jumphud/resource/ui/speedo_absolute_off.res; console_unlog"

// toggle
alias jh_speedo_absolute_toggle jh_speedo_absolute_toggle_on;
alias jh_speedo_absolute_toggle_on "jh_speedo_absolute_on; alias jh_speedo_absolute_toggle jh_speedo_absolute_toggle_off;"
alias jh_speedo_absolute_toggle_off "jh_speedo_absolute_off; alias jh_speedo_absolute_toggle jh_speedo_absolute_toggle_on"

// DISABLE ALL SPEEDOS
alias jh_speedos_off "jh_speedo_soldier_toggle_off; jh_speedo_demo_toggle_off; jh_speedo_absolute_toggle_off;"