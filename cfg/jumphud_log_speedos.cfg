// SOLDIER/DEMO SPEEDO TOGGLES
alias "jh_speedos_clear"            "sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedos_active.txt;"
alias "jh_speedo_demo_enable"       "jh_speedos_clear; con_logfile cfg/jumphud/jh_speedos_active.txt; echo #base ../../custom/jumphud/resource/ui/customizations/speedo/speedo_demo.res; console_unlog"
alias "jh_speedo_soldier_enable"    "jh_speedos_clear; con_logfile cfg/jumphud/jh_speedos_active.txt; echo #base ../../custom/jumphud/resource/ui/customizations/speedo/speedo_soldier.res; console_unlog"

// BAR SPEEDOS TOGGLE
alias "jh_bspeedos_clear"           "sixense_clear_bindings; sixense_write_bindings jumphud/jh_barspeedos_active.txt;"
alias "jh_bspeedos_enable"          "jh_bspeedos_clear; con_logfile cfg/jumphud/jh_barspeedos_active.txt; echo #base ../../custom/jumphud/resource/ui/speedo_bars.res; console_unlog"

alias "jh_bspeedos_toggle"          "jh_bspeedos_toggle_on"
alias "jh_bspeedos_toggle_on"       "jh_bspeedos_enable; alias jh_bspeedos_toggle jh_bspeedos_toggle_off"
alias "jh_bspeedos_toggle_off"      "jh_bspeedos_clear; alias jh_bspeedos_toggle jh_bspeedos_toggle_on"