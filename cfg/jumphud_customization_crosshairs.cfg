//======================================================================================================================================================================================================================
// HUD CROSSHAIRS
//======================================================================================================================================================================================================================
alias "jh_xhair_visibility_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_crosshair_visibility.txt"
alias "jh_xhair_edge_clear"					"sixense_clear_bindings; sixense_write_bindings jumphud/jh_crosshair_edge.txt"
alias "jh_xhair_style_clear"				"sixense_clear_bindings; sixense_write_bindings jumphud/jh_crosshair_style.txt"
alias "jh_xhair_size_clear"					"sixense_clear_bindings; sixense_write_bindings jumphud/jh_crosshair_size.txt"
alias "jh_xhair_animation_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_crosshair_animation.txt"

alias "jh_xhair_visibility_log"				"con_logfile cfg/jumphud/jh_crosshair_visibility.txt"
alias "jh_xhair_edge_log"					"con_logfile cfg/jumphud/jh_crosshair_edge.txt"
alias "jh_xhair_style_log"					"con_logfile cfg/jumphud/jh_crosshair_style.txt"
alias "jh_xhair_size_log"					"con_logfile cfg/jumphud/jh_crosshair_size.txt"
alias "jh_xhair_animation_log"				"con_logfile cfg/jumphud/jh_crosshair_animation.txt"

//-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// VISIBILITY
//-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
alias "jh_xhair_visible"					"jh_xhair_visibility_clear; jh_xhair_visibility_log; echo x{CustomCrosshair{visible 1}}; console_unlog"
alias "jh_xhair_invisible"					"jh_xhair_visibility_clear; jh_xhair_visibility_log; echo x{CustomCrosshair{visible 0}}; console_unlog"

//-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// EDGE
//-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
alias "jh_xhair_outline"					"jh_xhair_edge_clear; jh_xhair_edge_log; echo #base ../../custom/jumphud/resource/ui/customizations/crosshair/crosshair_outline.res; console_unlog"
alias "jh_xhair_shadow"						"jh_xhair_edge_clear; jh_xhair_edge_log; echo #base ../../custom/jumphud/resource/ui/customizations/crosshair/crosshair_shadow.res; console_unlog"

