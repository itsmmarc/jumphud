// ctap aliases
alias +ctap "+duck 1; -duck 1; +jump 1";
alias -ctap "-jump 1";

// thirdperson toggle aliases
alias tptoggle tptoggleon;
alias tptoggleon  "thirdperson; alias tptoggle tptoggleoff";
alias tptoggleoff "firstperson; alias tptoggle tptoggleon";

// thirdperson hold aliases
alias +tphold "thirdperson";
alias -tphold "firstperson";

// Toggle Soldier HUD Speedo
alias toggle_soldier_speedos "speedo_soldier_toggle; hud_reloadscheme";

// Toggle Demo HUD Speedo
alias toggle_demo_speedos "speedo_demo_toggle; hud_reloadscheme";

// Toggle Absolute HUD Speedo
alias toggle_absolute_speedo "speedo_absolute_toggle; hud_reloadscheme";

// Toggle Tempus HSpeedo
alias toggle_tempus_hspeedo "sm_hspeedo;sm_speedo_yoff 0.55;exec speedocolour.cfg;";

// Toggle Tempus VSpeedo
alias toggle_tempus_vspeedo "sm_vspeedo;sm_speedo_yoff 0.55;exec speedocolour.cfg;";

// Toggle Tempus ASpeedo
alias toggle_tempus_aspeedo "sm_aspeedo;sm_speedo_yoff 0.55;exec speedocolour.cfg;";

