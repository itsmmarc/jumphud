//======================================================================================================================================================================================================================
// SOLDIER SPEEDOS
//======================================================================================================================================================================================================================
//======================================================================================================================================================================================================================
// SPEEDO SIZE
//======================================================================================================================================================================================================================
alias "jh_speedo_s_size_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedo_s_size.txt"

alias "jh_speedo_s_size_small"				"jh_speedo_s_size_clear; con_logfile cfg/jumphud/jh_speedo_s_size.txt; echo x{speedos{wide 52 tall 39}}; console_unlog"
alias "jh_speedo_s_size_medium"				"jh_speedo_s_size_clear; con_logfile cfg/jumphud/jh_speedo_s_size.txt; echo x{speedos{wide 72 tall 54}}; console_unlog"
alias "jh_speedo_s_size_large"				"jh_speedo_s_size_clear; con_logfile cfg/jumphud/jh_speedo_s_size.txt; echo x{speedos{wide 100 tall 75}}; console_unlog"
//-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
//======================================================================================================================================================================================================================
// HSPEEDO
//======================================================================================================================================================================================================================
alias "jh_speedos_s_h_vis_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedos_s_h_visibility.txt"

alias "jh_speedos_s_h_vis_log"				"con_logfile cfg/jumphud/jh_speedos_s_h_visibility.txt"

//-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// VISIBILITY
//-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
alias "jh_speedos_s_h_visible"					"jh_speedos_s_h_vis_clear; jh_speedos_s_h_vis_log; echo x{speedos{hspeedo_container{visible 1}}}; console_unlog"
alias "jh_speedos_s_h_invisible"				"jh_speedos_s_h_vis_clear; jh_speedos_s_h_vis_log; echo x{speedos{hspeedo_container{visible 0}}}; console_unlog"

