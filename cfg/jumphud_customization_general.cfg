alias "jh_custom_damage"					"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Damage_Selection {Visible 1}}}}}; console_unlog"
alias "jh_custom_match_status"				"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Match_Status_Selection {Visible 1}}}}}; console_unlog"
alias "jh_custom_meters"					"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Meters_Selection {Visible 1}}}}}; console_unlog"
alias "jh_custom_crosshairs"				"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Crosshairs_Selection {Visible 1}}}}}; console_unlog"
alias "jh_custom_miscellaneous"				"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Miscellaneous_Selection {Visible 1}}}}}; console_unlog"

//======================================================================================================================================================================================================================
// TRANSPARENT VIEWMODELS
//======================================================================================================================================================================================================================
alias "jh_trans_viewmodels_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_transparent_viewmodels.txt"

alias "jh_trans_viewmodels_on"				"exec jumphud_transparentviewmodels; jh_trans_viewmodels_clear; con_logfile cfg/jumphud/jh_transparent_viewmodels.txt; echo #base ../../custom/jumphud/resource/ui/customizations/transparent_viewmodels/transparent_viewmodels.res; console_unlog"
