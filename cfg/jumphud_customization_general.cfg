//======================================================================================================================================================================================================================
// CUSTOMIZATION MENU
//======================================================================================================================================================================================================================
alias "jh_customization_menu_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_customization_menu.txt"
alias "jh_customization_menu_log"			"con_logfile cfg/jumphud/jh_customization_menu.txt"

alias "jh_custom_home"						"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 1}}}}}; console_unlog"
alias "jh_custom_settings"					"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Quick_Settings_Selection {Visible 1}}}}}; console_unlog"
alias "jh_custom_speedos_soldier"			"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Speedos_Soldier_Selection {Visible 1}}}}}; console_unlog"
alias "jh_custom_speedos_demo"				"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Speedos_Demo_Selection {Visible 1}}}}}; console_unlog"
alias "jh_custom_crosshairs"				"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Crosshairs_Selection {Visible 1}}}}}; console_unlog"
alias "jh_custom_resolutions"				"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Resolution_Selection {Visible 1}}}}}; console_unlog"
alias "jh_custom_fonts"						"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Font_Selection {Visible 1}}}}}; console_unlog"
alias "jh_custom_miscellaneous"				"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Miscellaneous_Selection {Visible 1}}}}}; console_unlog"

//======================================================================================================================================================================================================================
// TRANSPARENT VIEWMODELS
//======================================================================================================================================================================================================================
alias "jh_trans_vmodels_config_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_trans_vmodels_config.txt;"
alias "jh_trans_vmodels_config_log"		"con_logfile cfg/jumphud/jh_trans_vmodels_config.txt"
alias "jh_trans_vmodels_config"         "exec jumphud/jh_trans_vmodels_config.txt"
alias "jh_trans_vmodels_config_on"      "exec jumphud_transparentviewmodels; jh_trans_vmodels_config_clear; jh_trans_vmodels_config_log; echo exec jumphud_transparentviewmodels; console_unlog"
alias "jh_trans_vmodels_config_off"     "exec jumphud_transparentviewmodels_off; jh_trans_vmodels_config_clear; jh_trans_vmodels_config_log; echo exec jumphud_transparentviewmodels_off; console_unlog"

alias "jh_trans_vmodels_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_transparent_viewmodels.txt;"

alias "jh_trans_vmodels_on"				"jh_trans_vmodels_config_on; jh_trans_vmodels_clear; con_logfile cfg/jumphud/jh_transparent_viewmodels.txt; echo #base ../../custom/jumphud/resource/ui/customizations/transparent_viewmodels/transparent_viewmodels.res; console_unlog"
alias "jh_trans_vmodels_off"	        "jh_trans_vmodels_config_off; jh_trans_vmodels_clear"
//-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

alias "jh_scoreboard_detailed_clear"    "sixense_clear_bindings; sixense_write_bindings jumphud/jh_scoreboard_detailed.txt;"
alias "jh_scoreboard_detailed_log"		"con_logfile cfg/jumphud/jh_scoreboard_detailed.txt"

alias "jh_scoreboard_detailed_on"   	"jh_scoreboard_detailed_clear; jh_scoreboard_detailed_log; echo #base ../../custom/jumphud/resource/ui/customizations/scoreboard/scoreboard_casual_detailed.res; console_unlog"
alias "jh_scoreboard_detailed_off"      "jh_scoreboard_detailed_clear"