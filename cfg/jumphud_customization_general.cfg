alias "jh_customization_menu_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_customization_menu.txt"
alias "jh_customization_menu_log"			"con_logfile cfg/jumphud/jh_customization_menu.txt"

alias "jh_custom_home"						"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 1}}}}}; console_unlog"
alias "jh_custom_settings"					"jh_customization_menu_clear; jh_customization_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Customization_Home_Panel {Visible 0} HUD_Quick_Settings_Selection {Visible 1}}}}}; console_unlog"
