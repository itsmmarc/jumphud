//======================================================================================================================================================================================================================
// HUD MESSAGE
//======================================================================================================================================================================================================================
// on
alias "jh_hudmessage_on"         "sixense_clear_bindings; sixense_write_bindings jumphud/jh_hudmessage.txt"

// off
alias "jh_hudmessage_off"           "jh_hudmessage_on; con_logfile cfg/jumphud/jh_hudmessage.txt; echo #base ../../custom/jumphud/resource/ui/hudmessage_off.res; console_unlog"
// toggle
alias jh_hudmessage_toggle jh_hudmessage_toggle_on;
alias jh_hudmessage_toggle_on "jh_hudmessage_on; alias jh_hudmessage_toggle jh_hudmessage_toggle_off;"
alias jh_hudmessage_toggle_off "jh_hudmessage_off; alias jh_hudmessage_toggle jh_hudmessage_toggle_on"