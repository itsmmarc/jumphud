alias "jh_slot3_d_select_ig_h"		        "jh_slot3_d_select_ig_clear; jh_slot3_d_select_ig_log; echo #base; echo ../../custom/jumphud/resource/ui/custom/speedo/demo/slot3/hspeedo.res; console_unlog"
