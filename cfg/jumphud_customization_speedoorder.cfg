alias "jh_slot3_d_select_menu_h"		        "jh_slot3_d_select_menu_clear; jh_slot3_d_select_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Speedos_Demo_Selection { Slot_3 { Selected_HSpeedo { Visible 1}}}}}}}; console_unlog"
alias "jh_slot3_d_select_menu_v"		        "jh_slot3_d_select_menu_clear; jh_slot3_d_select_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Speedos_Demo_Selection { Slot_3 { Selected_VSpeedo { Visible 1}}}}}}}; console_unlog"
alias "jh_slot3_d_select_menu_a"		        "jh_slot3_d_select_menu_clear; jh_slot3_d_select_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Speedos_Demo_Selection { Slot_3 { Selected_ASpeedo { Visible 1}}}}}}}; console_unlog"
alias "jh_slot3_d_select_menu_none"		    "jh_slot3_d_select_menu_clear; jh_slot3_d_select_menu_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_Speedos_Demo_Selection { Slot_3 { Selected_None { Visible 1}}}}}}}; console_unlog"

