alias "jh_slot3_d_select_h"		            "jh_slot3_d_select_ig_h;        jh_slot3_d_select_menu_h;"
alias "jh_slot3_d_select_v"		            "jh_slot3_d_select_ig_v;        jh_slot3_d_select_menu_v;"
