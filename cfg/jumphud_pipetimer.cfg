// BINDS
// +pipefire
// pt_slot1
// pt_slot2
// pt_slot3
// pt_qs

// Attack & PipeTimer animation trigger
alias "pt_on"       "alias +pipefire pt_fire"
alias "pt_off"      "alias +pipefire +attack"

pt_on   // default to pipefire on

alias "pt_fire"     "+attack; testhudanim DemoPipeTimerStart"
alias "-pipefire"   "-attack"

alias "pt_show"     "testhudanim DemoPipeTimerShow"
alias "pt_hide"     "testhudanim DemoPipeTimerHide"

alias "pt_slot1"    "slot1; pt_show; pt_on;     pt_qs_temp; alias pt_qs_temp pt_qs_1;"
alias "pt_slot2"    "slot2; pt_hide; pt_off;    pt_qs_temp; alias pt_qs_temp pt_qs_2;"
alias "pt_slot3"    "slot3; pt_hide; pt_off;    pt_qs_temp; alias pt_qs_temp pt_qs_3;"

// store current slot here
alias pt_qs_temp
// store what you want quickswitch button to do here
alias pt_qs
// individual quickswitch options
alias pt_qs_1  "alias pt_qs pt_slot1"
alias pt_qs_2  "alias pt_qs pt_slot2"
alias pt_qs_3  "alias pt_qs pt_slot3"