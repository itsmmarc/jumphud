// EDIT THESE TO MATCH YOUR KEYBINDS
// ALSO REPLACE ALL INSTANCES OF "mouse1" IN THIS FILE IF YOU USE A DIFFERENT BUTTON TO SHOOT
bind 1 "pf_slot1"
bind 2 "pf_slot2"
bind 3 "pf_slot3"
bind q qs

// Attack & PipeTimer animation trigger
alias "+pipefire"   "+attack; testhudanim DemoPipeTimerStart"
alias "-pipefire"   "-attack"

alias "pf_show"     "testhudanim DemoPipeTimerShow"
alias "pf_hide"     "testhudanim DemoPipeTimerHide"

alias "pf_slot1"    "slot1; pf_show; bind mouse1 +pipefire;  qs_temp; alias qs_temp qs_1;"
alias "pf_slot2"    "slot2; pf_hide; bind mouse1 +attack;    qs_temp; alias qs_temp qs_2;"
alias "pf_slot3"    "slot3; pf_hide; bind mouse1 +attack;    qs_temp; alias qs_temp qs_3;"

// store current slot here
alias qs_temp
// store what you want quickswitch button to do here
alias qs
// individual quickswitch options
alias qs_1  "alias qs pf_slot1"
alias qs_2  "alias qs pf_slot2"
alias qs_3  "alias qs pf_slot3"