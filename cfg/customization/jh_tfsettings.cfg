alias "jh_teamstatus_names_off"         "jh_teamstatus_clear;"
alias "jh_teamstatus_names_on"          "jh_teamstatus_clear; jh_teamstatus_log; echo #base; echo ../../custom/jumphud/resource/ui/custom/teamstatus/teamstatus_names_on.res; console_unlog"

