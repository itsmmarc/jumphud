//======================================================================================================================================================================================================================
// TRANSPARENT VIEWMODELS
//======================================================================================================================================================================================================================
alias "jh_trans_vmodels_config_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_trans_vmodels_config.txt;"
alias "jh_trans_vmodels_config_log"		"con_logfile cfg/jumphud/jh_trans_vmodels_config.txt"
alias "jh_trans_vmodels_config"         "exec jumphud/jh_trans_vmodels_config.txt"
alias "jh_trans_vmodels_config_on"      "exec jh_transparentviewmodels; jh_trans_vmodels_config_clear; jh_trans_vmodels_config_log; echo exec jh_transparentviewmodels; console_unlog"
alias "jh_trans_vmodels_config_off"     "exec jh_transparentviewmodels_off; jh_trans_vmodels_config_clear; jh_trans_vmodels_config_log; echo exec jh_transparentviewmodels_off; console_unlog"

alias "jh_trans_vmodels_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_transparent_viewmodels.txt;"

alias "jh_trans_vmodels_on"				"jh_trans_vmodels_config_on; jh_trans_vmodels_clear; con_logfile cfg/jumphud/jh_transparent_viewmodels.txt; echo #base; echo ../../custom/jumphud/resource/ui/custom/transparent_viewmodels/transparent_viewmodels.res; console_unlog"
alias "jh_trans_vmodels_off"	        "jh_trans_vmodels_config_off; jh_trans_vmodels_clear"

//======================================================================================================================================================================================================================
// SCOREBOARD DETAILS
//======================================================================================================================================================================================================================
alias "jh_scoreboard_detailed_clear"    "sixense_clear_bindings; sixense_write_bindings jumphud/jh_scoreboard_detailed.txt;"
alias "jh_scoreboard_detailed_log"		"con_logfile cfg/jumphud/jh_scoreboard_detailed.txt"

alias "jh_scoreboard_detailed_on"   	"jh_scoreboard_detailed_clear; jh_scoreboard_detailed_log; echo #base; echo ../../custom/jumphud/resource/ui/custom/scoreboard/scoreboard_casual_detailed.res; console_unlog"
alias "jh_scoreboard_detailed_off"      "jh_scoreboard_detailed_clear"

