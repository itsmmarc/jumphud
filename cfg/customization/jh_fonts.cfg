//======================================================================================================================================================================================================================
// PRIMARY FONTS
//======================================================================================================================================================================================================================
// Default font Coolvetica Italic looks uncentered so is moved slightly to the left by default, these aliases override this behaviour to be fully centered again when using other fonts
// center ammo & metal count in hudlayout
alias "jh_font_prim_align_hl_clear"     "sixense_clear_bindings; sixense_write_bindings jumphud/jh_font_prim_align_hudlayout.txt;"
alias "jh_font_prim_align_hl_log"		"con_logfile cfg/jumphud/jh_font_prim_align_hudlayout.txt"
alias "jh_font_prim_align_hl_off"       "jh_font_prim_align_hl_clear;"
alias "jh_font_prim_align_hl_on"        "jh_font_prim_align_hl_clear; jh_font_prim_align_hl_log; echo #base; echo ../../custom/jumphud/scripts/layouts/hudlayout_font_prim_align.res; console_unlog"

// center sticky count
alias "jh_font_prim_align_dp_clear"     "sixense_clear_bindings; sixense_write_bindings jumphud/jh_font_prim_align_demopipes.txt;"
alias "jh_font_prim_align_dp_log"	    "con_logfile cfg/jumphud/jh_font_prim_align_demopipes.txt"
alias "jh_font_prim_align_dp_off"       "jh_font_prim_align_dp_clear;"
alias "jh_font_prim_align_dp_on"        "jh_font_prim_align_dp_clear; jh_font_prim_align_dp_log; echo #base; echo ../../custom/jumphud/resource/ui/custom/demopipes/demopipes_font_prim_align.res; console_unlog"

// align ammo in jump mode
alias "jh_font_prim_align_aw_j_clear"       "sixense_clear_bindings; sixense_write_bindings jumphud/jh_font_prim_align_ammoweapons_jump.txt;"
alias "jh_font_prim_align_aw_j_log"	        "con_logfile cfg/jumphud/jh_font_prim_align_ammoweapons_jump.txt"
alias "jh_font_prim_align_aw_j_off"         "jh_font_prim_align_aw_j_clear;"
alias "jh_font_prim_align_aw_j_on"          "jh_font_prim_align_aw_j_clear; jh_font_prim_align_aw_j_log; echo #base; echo ../../custom/jumphud/resource/ui/custom/ammo/ammoweapons_font_prim_align_jump.res; console_unlog"

// align ammo in casual mode
alias "jh_font_prim_align_aw_c_clear"       "sixense_clear_bindings; sixense_write_bindings jumphud/jh_font_prim_align_ammoweapons_casual.txt;"
alias "jh_font_prim_align_aw_c_log"	        "con_logfile cfg/jumphud/jh_font_prim_align_ammoweapons_casual.txt"
alias "jh_font_prim_align_aw_c_off"         "jh_font_prim_align_aw_c_clear;"
alias "jh_font_prim_align_aw_c_on"          "jh_font_prim_align_aw_c_clear; jh_font_prim_align_aw_c_log; echo #base; echo ../../custom/jumphud/resource/ui/custom/ammo/ammoweapons_font_prim_align_casual.res; console_unlog"

alias "jh_font_prim_align_off"      "jh_font_prim_align_hl_off; jh_font_prim_align_dp_off; jh_font_prim_align_aw_j_off; jh_font_prim_align_aw_c_off"
alias "jh_font_prim_align_on"       "jh_font_prim_align_hl_on; jh_font_prim_align_dp_on; jh_font_prim_align_aw_j_on; jh_font_prim_align_aw_c_on"
