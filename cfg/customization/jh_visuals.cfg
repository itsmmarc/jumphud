// mirrorworld keys
alias "jh_mirrorkeys_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_mirrorkeys.txt"
alias "jh_mirrorkeys_log"	"con_logfile cfg/jumphud/jh_mirrorkeys.txt"

alias "jh_mirrorkeys_on"        "jh_mirrorkeys_clear; jh_mirrorkeys_log; echo exec jumphud/jh_mirrorkeys_mode.txt; console_unlog"
