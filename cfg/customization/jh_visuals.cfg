alias "jh_mirrorworld_check_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_mirrorworld_check.txt"
alias "jh_mirrorworld_check_log"	"con_logfile cfg/jumphud/jh_mirrorworld_check.txt"

alias "jh_mirrorworld_check_off"	"jh_mirrorworld_check_clear"
alias "jh_mirrorworld_check_on"	        "jh_mirrorworld_check_clear; jh_mirrorworld_check_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_JumpSettings_Selection {CVAR_Container {CVAR_Settings {Mirror_World_Toggle {Check {Visible 1}}}}}}}}}; console_unlog"

alias "jh_mirrorworld_state_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_mirrorworld_state.txt"
alias "jh_mirrorworld_state_log"	"con_logfile cfg/jumphud/jh_mirrorworld_state.txt"

