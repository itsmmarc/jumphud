//======================================================================================================================================================================================================================
// BUBBLES STYLE
//======================================================================================================================================================================================================================
alias jh_water_particles_toggle         jh_water_particles_off
alias jh_water_particles_on             "jh_water_particles_state_on; jh_water_particles_default; jh_water_particles_check_on; alias jh_water_particles_toggle jh_water_particles_off"
alias jh_water_particles_off            "jh_water_particles_state_off; jh_water_particles_blank; jh_water_particles_check_off; alias jh_water_particles_toggle jh_water_particles_on"


alias "jh_water_particles_clear"        "sixense_clear_bindings; sixense_write_bindings jumphud/jh_water_particles.txt;"
alias "jh_water_particles_log"	        "con_logfile cfg/jumphud/jh_water_particles.txt"

alias "jh_water_particles_blank"   	"jh_water_particles_clear; jh_water_particles_log; echo #base; echo ../../custom/jumphud/materials/vgui/replay/thumbnails/blank.vmt; console_unlog"
alias "jh_water_particles_default"      "jh_water_particles_clear;"

alias "jh_water_particles_check_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_water_particles_check.txt"
alias "jh_water_particles_check_log"	"con_logfile cfg/jumphud/jh_water_particles_check.txt"

alias "jh_water_particles_check_off"	"jh_water_particles_check_clear"
alias "jh_water_particles_check_on"	"jh_water_particles_check_clear; jh_water_particles_check_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_JumpSettings_Selection {CVAR_Container {CVAR_Settings {Water_Particles_Toggle {Check {Visible 1}}}}}}}}}; console_unlog"

alias "jh_water_particles_state_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_water_particles_state.txt"
alias "jh_water_particles_state_log"	"con_logfile cfg/jumphud/jh_water_particles_state.txt"

alias jh_water_particles_state            "exec jh/jh_water_particles_state.txt"
alias jh_water_particles_state_on         "jh_water_particles_state_clear; jh_water_particles_state_log; echo alias jh_water_particles_toggle jh_water_particles_off; console_unlog"
alias jh_water_particles_state_off        "jh_water_particles_state_clear; jh_water_particles_state_log; echo alias jh_water_particles_toggle jh_water_particles_on; console_unlog"

