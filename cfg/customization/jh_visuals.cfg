alias "jh_water_particles_check_log"	"con_logfile cfg/jumphud/jh_water_particles_check.txt"

alias "jh_water_particles_check_off"	"jh_water_particles_check_clear; jh_water_particles_check_log; echo X{MainMenuOverride { SafeMode { Customizations_Panel { HUD_JumpSettings_Selection {CVAR_Container {CVAR_Settings {Water_Particles_Toggle {Check {Visible 0}}}}}}}}}; console_unlog"
