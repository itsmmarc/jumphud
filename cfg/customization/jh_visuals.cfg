//======================================================================================================================================================================================================================
// MIRROR WORLD
//======================================================================================================================================================================================================================
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// MIRROR WORLD SHADER (OVERRIDES SHADERS)
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// MAIN
alias jh_mirrorworld_toggle         jh_mirrorworld_on
alias jh_mirrorworld_on             "jh_mirrorworld_cfg_on; jh_mirrorworld_state_on; jh_mirrorworld_check_on; alias jh_mirrorworld_toggle jh_mirrorworld_off"
alias jh_mirrorworld_off            "jh_mirrorworld_cfg_off; jh_mirrorworld_state_off; jh_mirrorworld_check_off; alias jh_mirrorworld_toggle jh_mirrorworld_on"
//
alias "jh_mirror_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_shader_mirrorworld.txt"
alias "jh_mirror_log"			"con_logfile cfg/jumphud/jh_shader_mirrorworld.txt"

alias "jh_mirror_on"		        "jh_mirror_clear; jh_mirror_log; echo #base; echo ../../custom/jumphud/resource/ui/shader_mirrorworld.res; console_unlog"
alias "jh_mirror_off"                   "jh_mirror_clear"

alias "jh_mirrormenu_clear"		"sixense_clear_bindings; sixense_write_bindings jumphud/jh_shader_mirrorworld_menu.txt"
alias "jh_mirrormenu_log"		"con_logfile cfg/jumphud/jh_shader_mirrorworld_menu.txt"

alias "jh_mirrormenu_on"		"jh_mirrormenu_clear; jh_mirrormenu_log; echo X{MainMenuOverride{CustomShaderOverlay{SubButton{Visible 1}}}}; console_unlog"
alias "jh_mirrormenu_off"               "jh_mirrormenu_clear"

////////////////////////////////////////////////////////////

alias "jh_mirrorworld_cfg_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_mirrorworld_config.txt"
alias "jh_mirrorworld_cfg_log"		"con_logfile cfg/jumphud/jh_mirrorworld_config.txt"

alias "jh_mirrorworld_cfg"             "exec jumphud/jh_mirrorworld_config.txt" // exec on startup
alias "jh_mirrorworld_cfg_on"          "exec jh_mirrorworld.cfg; jh_mirrorworld_cfg_clear; jh_mirrorworld_cfg_log; echo exec jh_mirrorworld.cfg; console_unlog"
alias "jh_mirrorworld_cfg_off"         "exec jh_mirrorworld_off.cfg; jh_mirrorworld_cfg_clear; jh_mirrorworld_cfg_log; echo exec jh_mirrorworld_off.cfg; console_unlog"

