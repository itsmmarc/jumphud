// ALL SPEEDOS OFF
alias "jh_speedos_off"              "jh_speedo_d_toggle_off; jh_speedo_s_toggle_off; jh_bspeedos_toggle_off"

// SOLDIER/DEMO SPEEDOS LOG
alias "jh_speedos_clear"            "sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedos_active.txt;"
alias "jh_speedos_log"              "con_logfile cfg/jumphud/jh_speedos_active.txt;"

// DEMO SPEEDOS TOGGLE
alias "jh_speedo_demo_enable"       "jh_speedos_clear; jh_speedos_log; echo #base; echo ../../custom/jumphud/speedo/speedo_demo.res; console_unlog"

alias "jh_speedo_d_toggle"          "jh_speedo_d_toggle_on"
alias "jh_speedo_d_toggle_on"       "jh_speedo_s_toggle_off; jh_speedo_demo_enable; alias jh_speedo_d_toggle jh_speedo_d_toggle_off"
alias "jh_speedo_d_toggle_off"      "jh_speedos_clear; alias jh_speedo_d_toggle jh_speedo_d_toggle_on"

// SOLDIER SPEEDOS TOGGLE
alias "jh_speedo_sol_enable"    "jh_speedos_clear; jh_speedos_log; echo #base; echo ../../custom/jumphud/speedo/speedo_sol.res; console_unlog"

alias "jh_speedo_s_toggle"          "jh_speedo_s_toggle_on"
alias "jh_speedo_s_toggle_on"       "jh_speedo_d_toggle_off; jh_bspeedos_toggle_off; jh_speedo_sol_enable; alias jh_speedo_s_toggle jh_speedo_s_toggle_off"
alias "jh_speedo_s_toggle_off"      "jh_speedos_clear; alias jh_speedo_s_toggle jh_speedo_s_toggle_on"

// BAR SPEEDOS TOGGLE
alias "jh_bspeedos_clear"           "sixense_clear_bindings; sixense_write_bindings jumphud/jh_barspeedos_active.txt;"
alias "jh_bspeedos_enable"          "jh_bspeedos_clear; con_logfile cfg/jumphud/jh_barspeedos_active.txt; echo #base; echo ../../custom/jumphud/speedo_b/speedo_bars.res; console_unlog"

alias "jh_bspeedos_toggle"          "jh_bspeedos_toggle_on"
alias "jh_bspeedos_toggle_on"       "jh_bspeedos_enable; alias jh_bspeedos_toggle jh_bspeedos_toggle_off"
alias "jh_bspeedos_toggle_off"      "jh_bspeedos_clear; alias jh_bspeedos_toggle jh_bspeedos_toggle_on"

// SKEYS TOGGLE
alias "jh_skeys_clear"           "sixense_clear_bindings; sixense_write_bindings jumphud/jh_skeys_active.txt;"
alias "jh_skeys_enable"          "jh_skeys_clear; con_logfile cfg/jumphud/jh_skeys_active.txt; echo #base; echo ../../custom/jumphud/resource/ui/skeys_base.res; console_unlog"

alias "jh_skeys_toggle"          "jh_skeys_toggle_on"
alias "jh_skeys_toggle_on"       "jh_skeys_state_on; jh_skeys_enable; alias jh_skeys_toggle jh_skeys_toggle_off"
alias "jh_skeys_toggle_off"      "jh_skeys_state_off; jh_skeys_clear; alias jh_skeys_toggle jh_skeys_toggle_on"

alias "jh_skeys_state_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_skeys_state.txt"
alias "jh_skeys_state_log"	"con_logfile cfg/jumphud/jh_skeys_state.txt"

alias jh_skeys_state            "exec jumphud/jh_skeys_state.txt"
alias jh_skeys_state_on         "jh_skeys_state_clear; jh_skeys_state_log; echo alias jh_skeys_toggle jh_skeys_toggle_off; console_unlog"
alias jh_skeys_state_off        "jh_skeys_state_clear; jh_skeys_state_log; echo alias jh_skeys_toggle jh_skeys_toggle_on; console_unlog"

// SPEEDO RAINBOW TOGGLE
alias "jh_speedorainbow_clear"           "sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedorainbow.txt;"
alias "jh_speedorainbow_enable"          "jh_speedorainbow_clear; con_logfile cfg/jumphud/jh_speedorainbow.txt; echo x; echo {; echo $enableRainbow; echo 1; echo }; console_unlog"

alias "jh_speedorainbow"          "jh_speedorainbow_on"
alias "jh_speedorainbow_on"       "jh_speedorainbow_enable; jh_speedorainbow_state_on; alias jh_speedorainbow jh_speedorainbow_off; exec jh_reloadkeymaterials"
alias "jh_speedorainbow_off"      "jh_speedorainbow_clear; jh_speedorainbow_state_off; alias jh_speedorainbow jh_speedorainbow_on; exec jh_reloadkeymaterials"

alias "jh_speedorainbow_state_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedorainbow_state.txt"
alias "jh_speedorainbow_state_log"	"con_logfile cfg/jumphud/jh_speedorainbow_state.txt"

alias jh_speedorainbow_state            "exec jumphud/jh_speedorainbow_state.txt"
alias jh_speedorainbow_state_on         "jh_speedorainbow_state_clear; jh_speedorainbow_state_log; echo alias jh_speedorainbow jh_speedorainbow_off; console_unlog"
alias jh_speedorainbow_state_off        "jh_speedorainbow_state_clear; jh_speedorainbow_state_log; echo alias jh_speedorainbow jh_speedorainbow_on; console_unlog"

// current time
alias "jh_ctime_on"           "sixense_clear_bindings; sixense_write_bindings jumphud/jh_currenttime.txt;"
alias "jh_ctime_off"          "jh_ctime_on; con_logfile cfg/jumphud/jh_currenttime.txt; echo x{CurrentTime{Visible 0 Enabled 0}}; console_unlog"

alias "jh_ctime_toggle"          "jh_ctime_toggle_off"
alias "jh_ctime_toggle_on"       "jh_ctime_state_on; jh_ctime_on; alias jh_ctime_toggle jh_ctime_toggle_off"
alias "jh_ctime_toggle_off"      "jh_ctime_state_off; jh_ctime_off; alias jh_ctime_toggle jh_ctime_toggle_on"

alias "jh_ctime_state_clear"	"sixense_clear_bindings; sixense_write_bindings jumphud/jh_currenttime_state.txt"
alias "jh_ctime_state_log"	"con_logfile cfg/jumphud/jh_currenttime_state.txt"

alias jh_ctime_state            "exec jumphud/jh_currenttime_state.txt"
alias jh_ctime_state_on         "jh_ctime_state_clear; jh_ctime_state_log; echo alias jh_ctime_toggle jh_ctime_toggle_off; console_unlog"
alias jh_ctime_state_off        "jh_ctime_state_clear; jh_ctime_state_log; echo alias jh_ctime_toggle jh_ctime_toggle_on; console_unlog"
