alias jh_version "exec jh_versioninfo.cfg"
alias jumphud_version jh_version
//======================================================================================================================================================================================================================
// KEYBINDS (for kb_act.lst)
//======================================================================================================================================================================================================================
// Hold Reset
alias +jh_holdreset        "testhudanim HoldReset_Start"
alias -jh_holdreset        "testhudanim HoldReset_Stop"

// Crouch Jump
alias +jh_crouchjump   "+jh_jump; +jh_duck"
alias -jh_crouchjump   "-jh_jump; -jh_duck"

// JDS
alias +jh_jds  "+jh_jump; spec_mode; +jh_duck; +jh_attack;"
alias -jh_jds  "-jh_jump; -jh_duck; -jh_attack;"

// Thirdperson Toggle
alias jh_tptoggle jh_tptoggleon;
alias jh_tptoggleon  "thirdperson; exec #thirdperson_camera.cfg; alias jh_tptoggle jh_tptoggleoff";
alias jh_tptoggleoff "firstperson; alias jh_tptoggle jh_tptoggleon";

// Thirdperson Hold
alias +jh_tphold "thirdperson; exec #thirdperson_camera.cfg";
alias -jh_tphold "firstperson";

// TEB
alias +jh_teb "+strafe; m_yaw 0.0001; m_pitch 0.0001"
alias -jh_teb "-strafe; m_yaw 0.022; m_pitch 0.022"

// Jump Bug
alias jh_jumpbugcrouch "+jh_duck;        alias +jh_jump +jh_jumpbugjump;      alias -jh_jump -jh_jumpbugjump"
alias +jh_jumpbugjump  "-jh_duck; +jh_jump_bak;"
alias -jh_jumpbugjump  "-jh_jump_bak;    alias +jh_jump +jh_jump_bak;    alias -jh_jump -jh_jump_bak"

// Viewmodel Toggle
alias jh_viewmodeltoggle "toggle r_drawviewmodel;"

// Toggle Tempus HSpeedo
alias toggle_tempus_hspeedo "sm_hspeedo; exec #tempus_speedo_config.cfg;";

// Toggle Tempus VSpeedo
alias toggle_tempus_vspeedo "sm_vspeedo; exec #tempus_speedo_config.cfg;";

// Toggle Tempus ASpeedo
alias toggle_tempus_aspeedo "sm_aspeedo; exec #tempus_speedo_config.cfg;";

