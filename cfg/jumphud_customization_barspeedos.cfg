//======================================================================================================================================================================================================================
// BAR SPEEDOS
//======================================================================================================================================================================================================================
//======================================================================================================================================================================================================================
// PRESETS
//======================================================================================================================================================================================================================
alias "jh_bspeedos_preset_jumphud"          "jh_bspeedo_otype_min; jh_bspeedo_ss_on; jh_bspeedo_trans_opaque; jh_bspeedo_h_visible; jh_bspeedo_v_visible; jh_bspeedo_dynclr_def; jh_color_bspeedo_h_dynamic; jh_color_bspeedo_v_dynamic"

//======================================================================================================================================================================================================================
// OVERLAY TYPE
//======================================================================================================================================================================================================================
alias "jh_bspeedo_otype_clear"			    "sixense_clear_bindings; sixense_write_bindings jumphud/jh_barspeedo_otype.txt"
alias "jh_bspeedo_otype_log"			    "con_logfile cfg/jumphud/jh_barspeedo_otype.txt"

alias "jh_bspeedo_otype_none"               "jh_bspeedo_otype_clear; jh_bspeedo_otype_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/barspeedos/speedo_bars_otype_none.res; console_unlog"
alias "jh_bspeedo_otype_min"                "jh_bspeedo_otype_clear; jh_bspeedo_otype_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/barspeedos/speedo_bars_otype_min.res; console_unlog"
alias "jh_bspeedo_otype_outline"            "jh_bspeedo_otype_clear; jh_bspeedo_otype_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/barspeedos/speedo_bars_otype_ol.res; console_unlog"

//======================================================================================================================================================================================================================
// TRANSPARENCY
//======================================================================================================================================================================================================================
alias "jh_bspeedo_trans_clear"	        "sixense_clear_bindings; sixense_write_bindings jumphud/jh_barspeedo_transparency.txt"
alias "jh_bspeedo_trans_log"	        "con_logfile cfg/jumphud/jh_barspeedo_transparency.txt"

alias "jh_bspeedo_trans_on"				"jh_bspeedo_trans_clear; jh_bspeedo_trans_log; echo UnlitGeneric { $prealpha 0.5 }; console_unlog"
alias "jh_bspeedo_trans_opaque"			"jh_bspeedo_trans_clear; jh_bspeedo_trans_log; echo UnlitGeneric { $prealpha 1 }; console_unlog"

//======================================================================================================================================================================================================================
// SWEETSPOT MARKERS
//======================================================================================================================================================================================================================
alias "jh_bspeedo_ss_clear"			    "sixense_clear_bindings; sixense_write_bindings jumphud/jh_barspeedo_sweetspots.txt"
alias "jh_bspeedo_ss_log"			    "con_logfile cfg/jumphud/jh_barspeedo_sweetspots.txt"

alias "jh_bspeedo_ss_on"				"jh_bspeedo_ss_clear;"
alias "jh_bspeedo_ss_off"				"jh_bspeedo_ss_clear; jh_bspeedo_ss_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/barspeedos/speedo_bars_sweetspots_off.res; console_unlog"

