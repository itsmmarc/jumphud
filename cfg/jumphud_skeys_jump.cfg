//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// SKEYS
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
alias "+skey_forward"   "+forward; testhudanim KeyPress_Forward"
alias "-skey_forward"   "-forward; testhudanim KeyRelease_Forward"

alias "+skey_left"      "+moveleft; testhudanim KeyPress_Left"
alias "-skey_left"      "-moveleft; testhudanim KeyRelease_Left"

alias "+skey_back"      "+back; testhudanim KeyPress_Back"
alias "-skey_back"      "-back; testhudanim KeyRelease_Back"

alias "+skey_right"     "+moveright; testhudanim KeyPress_Right"
alias "-skey_right"     "-moveright; testhudanim KeyRelease_Right"

alias "+skey_duck"      "+duck; testhudanim KeyPress_Duck"
alias "-skey_duck"      "-duck; testhudanim KeyRelease_Duck"

alias "+skey_jump"      "+jump; spec_mode; testhudanim KeyPress_Jump"
alias "-skey_jump"      "-jump; testhudanim KeyRelease_Jump"

alias "+skey_attack"    "+pipefire; spec_next; testhudanim KeyPress_Attack"
alias "-skey_attack"    "-pipefire; testhudanim KeyRelease_Attack"

alias "+skey_attack2"   "+attack2; spec_prev; testhudanim KeyPress_Attack2"
alias "-skey_attack2"   "-attack2; testhudanim KeyRelease_Attack2"

// Ctap
alias +skey_ctap "+duck 1; testhudanim KeyPress_CTapDuck; -duck 1; +skey_jump 1";
alias -skey_ctap "-skey_jump 1";

//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// NULL SKEYS
// Null-Canceling Movement script
// Prevents you from pressing two opposing directions, which causes you to stop moving

alias +skey_null_forward    "-skey_back;     +skey_forward;  alias check_forward    +skey_forward"
alias +skey_null_back       "-skey_forward;  +skey_back;     alias check_back       +skey_back"
alias +skey_null_left       "-skey_right;    +skey_left;     alias check_left       +skey_left"
alias +skey_null_right      "-skey_left;     +skey_right;    alias check_right      +skey_right"
alias -skey_null_forward    "-skey_forward;  check_back;     alias check_forward"
alias -skey_null_back       "-skey_back;     check_forward;  alias check_back"
alias -skey_null_left       "-skey_left;     check_right;    alias check_left"
alias -skey_null_right      "-skey_right;    check_left;     alias check_right"
alias check_forward
alias check_back
alias check_left
alias check_right

//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// PIPETIMER
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// BIND THESE
//-------------
// +pipefire
// pt_slot1
// pt_slot2
// pt_slot3
// pt_qs
//-------------

// Attack & PipeTimer animation trigger
alias "pt_on"       "alias +pipefire pt_fire"
// Just attack
alias "pt_off"      "alias +pipefire +attack"

// default to pipetimer on
pt_on

alias "pt_fire"     "+attack; testhudanim DemoPipeTimerStart"
alias "-pipefire"   "-attack"

// aliases to hide pipetimer & disable triggering of the animation when using secondary or melee slot
alias "pt_show"     "testhudanim DemoPipeTimerShow"
alias "pt_hide"     "testhudanim DemoPipeTimerHide"

alias "pt_slot1"    "slot1; pt_show; pt_on;     pt_qs_temp; alias pt_qs_temp pt_qs_1;"
alias "pt_slot2"    "slot2; pt_hide; pt_off;    pt_qs_temp; alias pt_qs_temp pt_qs_2;"
alias "pt_slot3"    "slot3; pt_hide; pt_off;    pt_qs_temp; alias pt_qs_temp pt_qs_3;"

// store current slot here
alias pt_qs_temp
// store what you want quickswitch button to do here
alias pt_qs
// individual quickswitch options
alias pt_qs_1  "alias pt_qs pt_slot1"
alias pt_qs_2  "alias pt_qs pt_slot2"
alias pt_qs_3  "alias pt_qs pt_slot3"