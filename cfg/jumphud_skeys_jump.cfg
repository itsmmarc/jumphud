//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// SKEYS
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
alias "+jh_forward"   "+forward; testhudanim KeyPress_Forward"
alias "-jh_forward"   "-forward; testhudanim KeyRelease_Forward"

alias "+jh_moveleft"      "+moveleft; testhudanim KeyPress_Left"
alias "-jh_moveleft"      "-moveleft; testhudanim KeyRelease_Left"

alias "+jh_back"      "+back; testhudanim KeyPress_Back"
alias "-jh_back"      "-back; testhudanim KeyRelease_Back"

alias "+jh_moveright"     "+moveright; testhudanim KeyPress_Right"
alias "-jh_moveright"     "-moveright; testhudanim KeyRelease_Right"

alias "+jh_duck"      "+duck; testhudanim KeyPress_Duck"
alias "-jh_duck"      "-duck; testhudanim KeyRelease_Duck"

alias "+jh_jump"      "+jump; spec_mode; testhudanim KeyPress_Jump"
alias "-jh_jump"      "-jump; testhudanim KeyRelease_Jump"
// backup used for jump bug bind
alias "+jh_jump_bak"      "+jump; spec_mode; testhudanim KeyPress_Jump"
alias "-jh_jump_bak"      "-jump; testhudanim KeyRelease_Jump"

alias "+jh_attack"    "+jh_pipefire; spec_next; testhudanim KeyPress_Attack"
alias "-jh_attack"    "-jh_pipefire; testhudanim KeyRelease_Attack"

alias "+jh_attack2"   "+attack2; spec_prev; testhudanim KeyPress_Attack2"
alias "-jh_attack2"   "-attack2; testhudanim KeyRelease_Attack2"

// Ctap
alias +jh_ctap "+duck 1; testhudanim KeyPress_CTapDuck; -duck 1; +jh_jump 1";
alias -jh_ctap "-jh_jump 1";

//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// NULL SKEYS
// Null-Canceling Movement script
// Prevents you from pressing two opposing directions, which causes you to stop moving

alias +jh_null_forward    "-jh_back;     +jh_forward;  alias jh_check_forward    +jh_forward"
alias +jh_null_back       "-jh_forward;  +jh_back;     alias jh_check_back       +jh_back"
alias +jh_null_moveleft       "-jh_moveright;    +jh_moveleft;     alias jh_check_moveleft       +jh_moveleft"
alias +jh_null_moveright      "-jh_moveleft;     +jh_moveright;    alias jh_check_moveright      +jh_moveright"
alias -jh_null_forward    "-jh_forward;  jh_check_back;     alias jh_check_forward"
alias -jh_null_back       "-jh_back;     jh_check_forward;  alias jh_check_back"
alias -jh_null_moveleft       "-jh_moveleft;     jh_check_moveright;    alias jh_check_moveleft"
alias -jh_null_moveright      "-jh_moveright;    jh_check_moveleft;     alias jh_check_moveright"
alias jh_check_forward
alias jh_check_back
alias jh_check_moveleft
alias jh_check_moveright

//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// PIPETIMER
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// BIND THESE
//-------------
// +jh_attack
// jh_slot1
// jh_slot2
// jh_slot3
// jh_pt_qs
//-------------

// Attack & PipeTimer animation trigger
alias "jh_pt_on"       "alias +jh_pipefire jh_pt_fire"
// Just attack
alias "jh_pt_off"      "alias +jh_pipefire +attack"

// default to pipetimer on
jh_pt_on

alias "jh_pt_fire"     "+attack; testhudanim DemoPipeTimerStart"
alias "-jh_pipefire"   "-attack"

// aliases to hide pipetimer & disable triggering of the animation when using secondary or melee slot
alias "jh_pt_show"     "testhudanim DemoPipeTimerShow"
alias "jh_pt_hide"     "testhudanim DemoPipeTimerHide"

alias "jh_slot1"    "slot1; jh_pt_show; jh_pt_on;     jh_jh_pt_qs_temp; alias jh_jh_pt_qs_temp jh_pt_qs_1;"
alias "jh_slot2"    "slot2; jh_pt_hide; jh_pt_off;    jh_jh_pt_qs_temp; alias jh_jh_pt_qs_temp jh_pt_qs_2;"
alias "jh_slot3"    "slot3; jh_pt_hide; jh_pt_off;    jh_jh_pt_qs_temp; alias jh_jh_pt_qs_temp jh_pt_qs_3;"

// store current slot here
alias jh_jh_pt_qs_temp
// store what you want quickswitch button to do here
alias jh_pt_qs
// individual quickswitch options
alias jh_pt_qs_1  "alias jh_pt_qs jh_slot1"
alias jh_pt_qs_2  "alias jh_pt_qs jh_slot2"
alias jh_pt_qs_3  "alias jh_pt_qs jh_slot3"