//======================================================================================================================================================================================================================
// KEYBINDS (for kb_act.lst)
//======================================================================================================================================================================================================================
// Ctap
alias +ctap "+duck 1; -duck 1; +jump 1";
alias -ctap "-jump 1";

// Thirdperson Toggle
alias tptoggle tptoggleon;
alias tptoggleon  "thirdperson; alias tptoggle tptoggleoff";
alias tptoggleoff "firstperson; alias tptoggle tptoggleon";

// Thirdperson Hold
alias +tphold "thirdperson";
alias -tphold "firstperson";

// Viewmodel Toggle
alias viewmodeltoggle "toggle r_drawviewmodel;"

// Toggle Tempus HSpeedo
alias toggle_tempus_hspeedo "sm_hspeedo;sm_speedo_yoff 0.55;exec speedocolour.cfg;";

// Toggle Tempus VSpeedo
alias toggle_tempus_vspeedo "sm_vspeedo;sm_speedo_yoff 0.55;exec speedocolour.cfg;";

// Toggle Tempus ASpeedo
alias toggle_tempus_aspeedo "sm_aspeedo;sm_speedo_yoff 0.55;exec speedocolour.cfg;";

// ELANDI SPRAYS
alias spray_Wood            "sm_spray sprays/Wood"
alias spray_massiveWood     "sm_spray sprays/massiveWood"
alias spray_WoodFB          "sm_spray sprays/WoodFB"
alias spray_WoodL           "sm_spray sprays/WoodL"
alias spray_massiveWoodL    "sm_spray sprays/massiveWoodL"
alias spray_Dev             "sm_spray sprays/Dev"
alias spray_massiveDev      "sm_spray sprays/massiveDev"
alias spray_massiveDevRed   "sm_spray sprays/massiveDevRed"
alias spray_wallhacklarge   "sm_spray sprays/wallhacklarge"

alias spray_golly           "sm_spray sprays/golly"
//======================================================================================================================================================================================================================
// MISC
//======================================================================================================================================================================================================================
alias "jh_casualconfig"     "exec USER_casualconfig;"
alias "jh_jumpconfig"       "exec USER_jumpconfig;"
alias "fullhudreload"       "hud_reloadscheme; toggle mat_aaquality"
alias "console_unlog"       "con_logfile console.log"