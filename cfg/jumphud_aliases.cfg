// NULL SKEYS
// Null-Canceling Movement script
// Prevents you from pressing two opposing directions, which causes you to stop moving

alias +jhc_null_forward    "-jhc_back;     +jhc_forward;  alias jhc_check_forward    +jhc_forward"
alias +jhc_null_back       "-jhc_forward;  +jhc_back;     alias jhc_check_back       +jhc_back"
alias +jhc_null_moveleft       "-jhc_moveright;    +jhc_moveleft;     alias jhc_check_moveleft       +jhc_moveleft"
alias +jhc_null_moveright      "-jhc_moveleft;     +jhc_moveright;    alias jhc_check_moveright      +jhc_moveright"
alias -jhc_null_forward    "-jhc_forward;  jhc_check_back;     alias jhc_check_forward"
alias -jhc_null_back       "-jhc_back;     jhc_check_forward;  alias jhc_check_back"
alias -jhc_null_moveleft       "-jhc_moveleft;     jhc_check_moveright;    alias jhc_check_moveleft"
alias -jhc_null_moveright      "-jhc_moveright;    jhc_check_moveleft;     alias jhc_check_moveright"
alias jhc_check_forward
alias jhc_check_back
alias jhc_check_moveleft
alias jhc_check_moveright

