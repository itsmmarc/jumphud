//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// PIPETIMER
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// BIND THESE
//-------------
// +jhj_attack
// jhj_slot1
// jhj_slot2
// jhj_slot3
// jhj_lastinv
//-------------

// Attack & PipeTimer animation trigger
alias "jhj_pt_on"       "alias +jhj_pipefire jhj_pt_fire"
// Just attack
alias "jhj_pt_off"      "alias +jhj_pipefire +attack"

// default to pipetimer on
jhj_pt_on

alias "jhj_pt_fire"     "+attack; testhudanim DemoPipeTimerStart"
alias "-jhj_pipefire"   "-attack"

// aliases to hide pipetimer & disable triggering of the animation when using secondary or melee slot
alias "jhj_pt_show"     "testhudanim DemoPipeTimerShow"
alias "jhj_pt_hide"     "testhudanim DemoPipeTimerHide"

alias "jhj_slot1"    "slot1; jhj_pt_show; jhj_pt_on;     jhj_lastinv_temp; alias jhj_lastinv_temp jhj_lastinv_1;"
alias "jhj_slot2"    "slot2; jhj_pt_hide; jhj_pt_off;    jhj_lastinv_temp; alias jhj_lastinv_temp jhj_lastinv_2;"
alias "jhj_slot3"    "slot3; jhj_pt_hide; jhj_pt_off;    jhj_lastinv_temp; alias jhj_lastinv_temp jhj_lastinv_3;"

// store current slot here
alias jhj_lastinv_temp
// store what you want quickswitch button to do here
alias jhj_lastinv
// individual quickswitch options
alias jhj_lastinv_1  "alias jhj_lastinv jhj_slot1"
alias jhj_lastinv_2  "alias jhj_lastinv jhj_slot2"
alias jhj_lastinv_3  "alias jhj_lastinv jhj_slot3"