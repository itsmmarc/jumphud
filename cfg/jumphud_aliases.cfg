alias "jh_casualconfig"     "exec USER_casualconfig;"
alias "jh_jumpconfig"       "exec USER_jumpconfig;"
alias "fullhudreload"       "hud_reloadscheme; toggle mat_aaquality"
alias "console_unlog"       "con_logfile console.log"