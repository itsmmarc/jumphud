//======================================================================================================================================================================================================================
// KEYBINDS (for kb_act.lst)
//======================================================================================================================================================================================================================
// Hold Reset
alias +holdreset        "testhudanim HoldReset_Start"
alias -holdreset        "testhudanim HoldReset_Off"

// Crouch Jump
alias +crouchjump   "+skey_jump; +skey_duck"
alias -crouchjump   "-skey_jump; -skey_duck"

// JDS
alias +jds  "+skey_jump; +skey_duck; +skey_attack;"
alias -jds  "-skey_jump; -skey_duck; -skey_attack;"

// Thirdperson Toggle
alias tptoggle tptoggleon;
alias tptoggleon  "thirdperson; exec #thirdperson_camera.cfg; alias tptoggle tptoggleoff";
alias tptoggleoff "firstperson; alias tptoggle tptoggleon";

// Thirdperson Hold
alias +tphold "thirdperson; exec #thirdperson_camera.cfg";
alias -tphold "firstperson";

// TEB
alias +teb "+strafe; m_yaw 0.0001; m_pitch 0.0001"
alias -teb "-strafe; m_yaw 0.022; m_pitch 0.022"

// Jump Bug
alias jumpbugcrouch "+skey_duck;        alias +skey_jump +jumpbugjump;      alias -skey_jump -jumpbugjump"
alias +jumpbugjump  "-skey_duck; +skey_jump_bak;"
alias -jumpbugjump  "-skey_jump_bak;    alias +skey_jump +skey_jump_bak;    alias -skey_jump -skey_jump_bak"

// Viewmodel Toggle
alias viewmodeltoggle "toggle r_drawviewmodel;"

// Toggle Tempus HSpeedo
alias toggle_tempus_hspeedo "sm_hspeedo;sm_speedo_yoff 0.55;exec speedocolour.cfg;";

// Toggle Tempus VSpeedo
alias toggle_tempus_vspeedo "sm_vspeedo;sm_speedo_yoff 0.55;exec speedocolour.cfg;";

// Toggle Tempus ASpeedo
alias toggle_tempus_aspeedo "sm_aspeedo;sm_speedo_yoff 0.55;exec speedocolour.cfg;";

