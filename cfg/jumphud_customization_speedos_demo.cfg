//======================================================================================================================================================================================================================
// SPEEDOS ROUNDING
//======================================================================================================================================================================================================================
alias "jh_speedo_d_round_clear"         "sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedo_d_rounding.txt;"
alias "jh_speedo_d_round_log"		    "con_logfile cfg/jumphud/jh_speedo_d_rounding.txt"

alias "jh_speedo_d_round_always"        "jh_speedo_d_round_clear;"
alias "jh_speedo_d_round_never"         "jh_speedo_d_round_clear; jh_speedo_d_round_log; echo UnlitGeneric{; echo $roundAmount; echo 1}; console_unlog"

//======================================================================================================================================================================================================================
// SPEEDO SIZE
//======================================================================================================================================================================================================================
alias "jh_speedo_d_size_clear"			    "sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedo_d_size.txt"

alias "jh_speedo_d_size_small"				"jh_speedo_d_size_clear; con_logfile cfg/jumphud/jh_speedo_d_size.txt; echo x{speedos{wide 52 tall 39}}; console_unlog"
alias "jh_speedo_d_size_medium"				"jh_speedo_d_size_clear; con_logfile cfg/jumphud/jh_speedo_d_size.txt; echo x{speedos{wide 72 tall 54}}; console_unlog"
alias "jh_speedo_d_size_large"				"jh_speedo_d_size_clear; con_logfile cfg/jumphud/jh_speedo_d_size.txt; echo x{speedos{wide 84 tall 63}}; console_unlog"
//======================================================================================================================================================================================================================
// SPEEDO SHADOWS
//======================================================================================================================================================================================================================
alias "jh_speedo_d_shadows_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedo_d_shadows.txt"

alias "jh_speedo_d_shadows_on"				"jh_speedo_d_shadows_clear;"
// need to space out the echos like this otherwise they get jumbled
alias "jh_speedo_d_shadows_off"				"jh_speedo_d_shadows_clear; con_logfile cfg/jumphud/jh_speedo_d_shadows.txt; jh_speedo_d_shadows_off_res; console_unlog"
alias "jh_speedo_d_shadows_off_res"         "echo x{; jh_speedo_d_shadows_off_res2"
alias "jh_speedo_d_shadows_off_res2"        "echo speedos{; jh_speedo_d_shadows_off_res6"

alias "jh_speedo_d_shadows_off_res6"        "echo hspeedo_container{; jh_speedo_d_shadows_off_res7"
alias "jh_speedo_d_shadows_off_res7"        "echo shadows_container{; jh_speedo_d_shadows_off_res8"
alias "jh_speedo_d_shadows_off_res8"        "echo visible 0}}; jh_speedo_d_shadows_off_res9"

alias "jh_speedo_d_shadows_off_res9"        "echo vspeedo_container{; jh_speedo_d_shadows_off_res10"
alias "jh_speedo_d_shadows_off_res10"        "echo shadows_container{; jh_speedo_d_shadows_off_res11"
alias "jh_speedo_d_shadows_off_res11"        "echo visible 0}}; jh_speedo_d_shadows_off_res12"

alias "jh_speedo_d_shadows_off_res12"        "echo aspeedo_container{; jh_speedo_d_shadows_off_res13"
alias "jh_speedo_d_shadows_off_res13"        "echo shadows_container{; jh_speedo_d_shadows_off_res14"
alias "jh_speedo_d_shadows_off_res14"        "echo visible 0}}}}; jh_speedo_d_shadows_off_res15"

