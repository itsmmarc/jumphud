//======================================================================================================================================================================================================================
// SPEEDO SHADOWS
//======================================================================================================================================================================================================================
alias "jh_speedo_d_shadows_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_speedo_d_shadows.txt"

alias "jh_speedo_d_shadows_on"				"jh_speedo_d_shadows_clear;"
// need to space out the echos like this otherwise they get jumbled
alias "jh_speedo_d_shadows_off"				"jh_speedo_d_shadows_clear; con_logfile cfg/jumphud/jh_speedo_d_shadows.txt; jh_speedo_d_shadows_off_res; console_unlog"
alias "jh_speedo_d_shadows_off_res"         "echo x{; jh_speedo_d_shadows_off_res2"
alias "jh_speedo_d_shadows_off_res2"        "echo speedos{; jh_speedo_d_shadows_off_res3"
alias "jh_speedo_d_shadows_off_res3"        "echo hspeedo_container{; jh_speedo_d_shadows_off_res4"
alias "jh_speedo_d_shadows_off_res4"        "echo hspeedo_shadow{; jh_speedo_d_shadows_off_res5"
alias "jh_speedo_d_shadows_off_res5"        "echo visible 0}}; jh_speedo_d_shadows_off_res6"
alias "jh_speedo_d_shadows_off_res6"        "echo vspeedo_container{; jh_speedo_d_shadows_off_res7"
alias "jh_speedo_d_shadows_off_res7"        "echo vspeedo_shadow{; jh_speedo_d_shadows_off_res8"
alias "jh_speedo_d_shadows_off_res8"        "echo visible 0}}; jh_speedo_d_shadows_off_res9"
alias "jh_speedo_d_shadows_off_res9"        "echo aspeedo_container{; jh_speedo_d_shadows_off_res10"
alias "jh_speedo_d_shadows_off_res10"       "echo aspeedo_shadow{; jh_speedo_d_shadows_off_res11"
alias "jh_speedo_d_shadows_off_res11"       "echo visible 0}}}}"
