//======================================================================================================================================================================================================================
// SPEEDO SIZE
//======================================================================================================================================================================================================================
alias "jh_heighto_size_clear"			    "sixense_clear_bindings; sixense_write_bindings jumphud/jh_heighto_size.txt"

alias "jh_heighto_size_small"				"jh_heighto_size_clear; con_logfile cfg/jumphud/jh_heighto_size.txt; echo x{heighto{wide 52 tall 13}}; console_unlog"
