//======================================================================================================================================================================================================================
// On first HUD launch creates a jumphud folder inside tf/cfg
//======================================================================================================================================================================================================================
alias "jh_folder" "host_writeconfig jumphud_temporary_cfg_backup.cfg full; ds_dir cfg/jumphud; ds_log 0; ds_record; ds_stop; exec jumphud_temporary_cfg_backup.cfg"
jh_folder

//======================================================================================================================================================================================================================
// Generates jh_setup.txt, stops the file from executing each time the game is launched
//======================================================================================================================================================================================================================
con_logfile		"cfg/jumphud/jh_setup.txt"
echo			"alias jh_firstrun"
con_logfile		"console.log"

//======================================================================================================================================================================================================================
// Extra HUD configuration
//======================================================================================================================================================================================================================
// tf_mm_dashboard_slide_panel_step "14"
cl_hud_minmode 1                // default to minmode on first run
jh_activeconfig "jh_jumpconfig" // default to jump config as the hud defaults to jump mode
jh_active_config_jump
jh_customization_reset