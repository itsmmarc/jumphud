//======================================================================================================================================================================================================================
// SHADERS
//======================================================================================================================================================================================================================
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// SHADER VISIBILITY
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
alias "jh_shader_cfg_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_shader_config.txt"
alias "jh_shader_cfg_log"			"con_logfile cfg/jumphud/jh_shader_config.txt"

alias "jh_shaderconfig"             "exec jumphud/jh_shader_config.txt"
alias "jh_shaderconfig_on"          "exec jumphud_shaders; jh_shader_cfg_clear; jh_shader_cfg_log; echo exec jumphud_shaders; console_unlog"
alias "jh_shaderconfig_off"         "exec jumphud_shaders_off; jh_shader_cfg_clear; jh_shader_cfg_log; echo exec jumphud_shaders_off; console_unlog"

alias "jh_shader_vis_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_shader_visiblity.txt"
alias "jh_shader_vis_log"			"con_logfile cfg/jumphud/jh_shader_visiblity.txt"

alias "jh_shader_vis_disabled"		"jh_shaderconfig_off; jh_shader_vis_clear; jh_shader_vis_log; echo x { CustomShaderOverlay { visible 0 }}; console_unlog"
alias "jh_shader_vis_enabled"		"jh_shaderconfig_on; jh_shader_vis_clear; jh_shader_vis_log; echo x { CustomShaderOverlay { visible 1 }}; console_unlog"

alias "jh_shader_vis_toggle"        "jh_shader_vis_toggleon"
alias "jh_shader_vis_toggleon"      "jh_shader_vis_enabled; alias jh_shader_vis_toggle jh_shader_vis_toggleoff"
alias "jh_shader_vis_toggleoff"     "jh_shader_vis_disabled; alias jh_shader_vis_toggle jh_shader_vis_toggleon"

//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// SHADER OPTIONS
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
alias "jh_shader_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_shader.txt"
alias "jh_shader_log"			"con_logfile cfg/jumphud/jh_shader.txt"

alias "jh_shader_blur"		    "jh_shader_clear; jh_shader_log; echo x { CustomShaderOverlay { image replay/thumbnails/shaders/blur        }}; console_unlog"
