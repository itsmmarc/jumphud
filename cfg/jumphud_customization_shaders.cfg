alias "jh_shader_kitsune"		"jh_shader_clear; jh_shader_log; echo x { CustomShaderOverlay { image replay/thumbnails/shaders/kitsune     }}; console_unlog"
alias "jh_shader_nightmode"		"jh_shader_clear; jh_shader_log; echo x { CustomShaderOverlay { image replay/thumbnails/shaders/nightmode   }}; console_unlog"
alias "jh_shader_notebook"		"jh_shader_clear; jh_shader_log; echo x { CustomShaderOverlay { image replay/thumbnails/shaders/notebook    }}; console_unlog"
alias "jh_shader_oilpaint"		"jh_shader_clear; jh_shader_log; echo x { CustomShaderOverlay { image replay/thumbnails/shaders/oilpaint    }}; console_unlog"
alias "jh_shader_psx"		    "jh_shader_clear; jh_shader_log; echo x { CustomShaderOverlay { image replay/thumbnails/shaders/psx	        }}; console_unlog"
alias "jh_shader_rain"		    "jh_shader_clear; jh_shader_log; echo x { CustomShaderOverlay { image replay/thumbnails/shaders/rain	    }}; console_unlog"
