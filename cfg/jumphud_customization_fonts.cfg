//======================================================================================================================================================================================================================
// PRIMARY FONTS
//======================================================================================================================================================================================================================
alias "jh_font_prim_clear"      "sixense_clear_bindings; sixense_write_bindings jumphud/jh_font_primary.txt;"
alias "jh_font_prim_log"		"con_logfile cfg/jumphud/jh_font_primary.txt"

alias "jh_font_prim_align_clear"    "sixense_clear_bindings; sixense_write_bindings jumphud/jh_font_prim_align.txt;"
alias "jh_font_prim_align_log"		"con_logfile cfg/jumphud/jh_font_prim_align.txt"

alias "jh_font_prim_align_off"      "jh_font_prim_align_clear;"
alias "jh_font_prim_align_on"       "jh_font_prim_align_clear; jh_font_prim_align_log; echo #base; echo ../../custom/jumphud/scripts/layouts/hudlayout_font_prim_align.res; console_unlog"

alias "jh_font_prim_cool_italic"    "jh_font_prim_align_off; jh_font_prim_clear;"
alias "jh_font_prim_cool_rgbold"    "jh_font_prim_align_on; jh_font_prim_clear; jh_font_prim_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_cool_rgbold.res; console_unlog"
alias "jh_font_prim_renogare"       "jh_font_prim_align_on; jh_font_prim_clear; jh_font_prim_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_renogare.res; console_unlog"
alias "jh_font_prim_poppins"        "jh_font_prim_align_on; jh_font_prim_clear; jh_font_prim_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_poppins.res; console_unlog"
alias "jh_font_prim_square"         "jh_font_prim_align_on; jh_font_prim_clear; jh_font_prim_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_square.res; console_unlog"
alias "jh_font_prim_steelfish"      "jh_font_prim_align_on; jh_font_prim_clear; jh_font_prim_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_steelfish.res; console_unlog"
alias "jh_font_prim_nk57"           "jh_font_prim_align_on; jh_font_prim_clear; jh_font_prim_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_nk57.res; console_unlog"
alias "jh_font_prim_bahnschrift"    "jh_font_prim_align_on; jh_font_prim_clear; jh_font_prim_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_bahnschrift.res; console_unlog"
alias "jh_font_prim_montserrat"     "jh_font_prim_align_on; jh_font_prim_clear; jh_font_prim_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_montserrat.res; console_unlog"
alias "jh_font_prim_eternal"        "jh_font_prim_align_on; jh_font_prim_clear; jh_font_prim_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_eternal.res; console_unlog"
alias "jh_font_prim_roboto"         "jh_font_prim_align_on; jh_font_prim_clear; jh_font_prim_log; echo #base; echo ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_roboto.res; console_unlog"

