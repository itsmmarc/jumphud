alias "jh_font_prim_clear"      "sixense_clear_bindings; sixense_write_bindings jumphud/jh_font_primary.txt;"
alias "jh_font_prim_log"		"con_logfile cfg/jumphud/jh_font_primary.txt"

// Default font Coolvetica Italic looks uncentered so is moved slightly to the left by default, these aliases override this behaviour to be fully centered again when using other fonts
alias "jh_font_prim_align_hl_clear"     "sixense_clear_bindings; sixense_write_bindings jumphud/jh_font_prim_align_hudlayout.txt;"
alias "jh_font_prim_align_hl_log"		"con_logfile cfg/jumphud/jh_font_prim_align_hudlayout.txt"

alias "jh_font_prim_align_hl_off"       "jh_font_prim_align_hl_clear;"
alias "jh_font_prim_align_hl_on"        "jh_font_prim_align_hl_clear; jh_font_prim_align_hl_log; echo #base; echo ../../custom/jumphud/scripts/layouts/hudlayout_font_prim_align.res; console_unlog"

alias "jh_font_prim_align_dp_clear"     "sixense_clear_bindings; sixense_write_bindings jumphud/jh_font_prim_align_demopipes.txt;"
alias "jh_font_prim_align_dp_log"	    "con_logfile cfg/jumphud/jh_font_prim_align_demopipes.txt"

