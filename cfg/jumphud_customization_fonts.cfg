//======================================================================================================================================================================================================================
// PRIMARY FONTS
//======================================================================================================================================================================================================================
alias "jh_font_prim_clear"      "sixense_clear_bindings; sixense_write_bindings jumphud/jh_font_primary.txt;"
alias "jh_font_prim_log"		"con_logfile cfg/jumphud/jh_font_primary.txt"

alias "jh_font_prim_cool_italic"    "jh_font_prim_clear;"
alias "jh_font_prim_renogare"       "jh_font_prim_clear; jh_font_prim_log; echo #base ../../custom/jumphud/resource/ui/customizations/fonts/font_prim_renogare.res; console_unlog"
