//======================================================================================================================================================================================================================
// PIPETIMER
//======================================================================================================================================================================================================================
// PRESETS
//======================================================================================================================================================================================================================
alias "jh_pipetimer_preset_jumphud"          "jh_pipetimer_type_charge; jh_color_pipetimer_main_blue; jh_color_pipetimer_flash_green"

//======================================================================================================================================================================================================================
// TIMER TYPE
//======================================================================================================================================================================================================================
alias "jh_pipetimer_type_clear"	        "sixense_clear_bindings; sixense_write_bindings jumphud/jh_pipetimer_type.txt"
alias "jh_pipetimer_type_log"           "con_logfile cfg/jumphud/jh_pipetimer_type.txt"

alias "jh_pipetimer_type_off"		    "jh_pipetimer_type_clear;"
alias "jh_pipetimer_type_center"		"jh_pipetimer_type_clear; jh_pipetimer_type_log; echo #base; echo ../../custom/jumphud/resource/ui/pipetimer_center.res; console_unlog"
alias "jh_pipetimer_type_charge"		"jh_pipetimer_type_clear; jh_pipetimer_type_log; echo #base; echo ../../custom/jumphud/resource/ui/pipetimer_chargeslot.res; console_unlog"

//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// COLOR
//----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
// MAIN COLOR
alias "jh_color_pipetimer_main_clear"			"sixense_clear_bindings; sixense_write_bindings jumphud/jh_color_pipetimer_main.txt"
alias "jh_color_pipetimer_main_log"				"con_logfile cfg/jumphud/jh_color_pipetimer_main.txt"
//-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------

alias "jh_color_pipetimer_main_white"			"jh_color_pipetimer_main_clear; jh_color_pipetimer_main_log; echo x{PipeTimerContainer_Charge; echo {DemoPipeTimerBar_Charge{bgcolor_override; echo m0reWhite}}  ; echo PipeTimerContainer{DemoPipeTimerBar; echo {bgcolor_override; echo   m0reWhite}}}; console_unlog"
