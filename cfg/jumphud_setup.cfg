//======================================================================================================================================================================================================================
// Make sure the time stamp is not included when printing lines
//======================================================================================================================================================================================================================
con_timestamp "0"

//======================================================================================================================================================================================================================
// Define aliases
//======================================================================================================================================================================================================================
exec jumphud_aliases.cfg

//======================================================================================================================================================================================================================
// Execute all customization files
//======================================================================================================================================================================================================================
exec jumphud_log_casual.cfg
exec jumphud_log_speedos.cfg
exec jumphud_log_extras.cfg
exec jumphud_customization_general.cfg
exec jumphud_customization_crosshairs.cfg
exec jumphud_customization_speedos_soldier.cfg
exec jumphud_customization_speedos_demo.cfg
exec jumphud_customization_barspeedos.cfg
exec jumphud_customization_speedographs.cfg
exec jumphud_customization_fonts.cfg
exec jumphud_customization_resolutions.cfg
exec jumphud_customization_reset.cfg
exec jumphud_shaders.cfg
exec jumphud_customization_shaders.cfg

//exec jumphud_dev.cfg

//======================================================================================================================================================================================================================
// Execute first HUD launch setup
//======================================================================================================================================================================================================================
alias "jh_firstrun" "exec jh_first_run"
exec jumphud/jh_setup.txt
jh_firstrun

//======================================================================================================================================================================================================================
// Execute default settings
//======================================================================================================================================================================================================================
alias dimmer_clicked ""     //Fix for general console spam
tf_hud_target_id_disable_floating_health 1
tf_hud_target_id_alpha 175  // alpha of targetid background colour
jh_hudmessage_toggle_on     // enable map pop up text
jh_speedos_off              // disable speedos
jh_active_config            // load user jump/casual config
jh_trans_vmodels_config     // load transparent viewmodel config if necessary
hud_reloadscheme

//======================================================================================================================================================================================================================
// Open welcome panel
//======================================================================================================================================================================================================================
alias "jh_welcome_reset" "sixense_clear_bindings; sixense_write_bindings jumphud/jh_setup_welcome.txt"  // call this to have welcome message appear on next launch
alias "jh_firstrun_welcome" "exec jh_first_run_welcome"
exec jumphud/jh_setup_welcome.txt
jh_firstrun_welcome