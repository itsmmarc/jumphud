//======================================================================================================================================================================================================================
// Make sure the time stamp is not included when printing lines
//======================================================================================================================================================================================================================
con_timestamp "0"

//======================================================================================================================================================================================================================
// Define aliases
//======================================================================================================================================================================================================================
exec jumphud_aliases.cfg

//======================================================================================================================================================================================================================
// Execute all customization files
//======================================================================================================================================================================================================================
exec jumphud_log_casual.cfg
exec jumphud_log_speedos.cfg
exec jumphud_log_extras.cfg
exec jumphud_customization_general.cfg
exec jumphud_customization_crosshairs.cfg
exec jumphud_customization_speedos.cfg
exec jumphud_log_reset.cfg

//======================================================================================================================================================================================================================
// Execute first HUD launch setup
//======================================================================================================================================================================================================================
alias "jh_firstrun" "exec jh_first_run"
exec jumphud/jh_setup.txt
jh_firstrun

//======================================================================================================================================================================================================================
// Execute default settings
//======================================================================================================================================================================================================================
tf_hud_target_id_disable_floating_health 1
jh_hudmessage_toggle_on     // enable map pop up text
jh_speedos_off              // disable speedos
jh_active_config            // load user jump/casual config
jh_trans_viewmodels_config  // load transparent viewmodel config if necessary
hud_reloadscheme