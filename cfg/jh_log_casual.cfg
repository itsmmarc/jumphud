//======================================================================================================================================================================================================================
// CASUAL MODE
//======================================================================================================================================================================================================================
alias "jh_active_config_clear"      "sixense_clear_bindings; sixense_write_bindings jumphud/jh_active_config.txt;"
alias "jh_active_config_log"        "con_logfile cfg/jumphud/jh_active_config.txt"
alias "jh_active_config"            "exec jumphud/jh_active_config.txt"
alias "jh_active_config_casual"     "exec #casualconfig; jh_active_config_clear; jh_active_config_log; echo exec #casualconfig; console_unlog"
alias "jh_active_config_jump"       "exec #jumpconfig; jh_active_config_clear; jh_active_config_log; echo exec #jumpconfig; console_unlog"


// casual off
alias "jh_mmdashboard_clear"        "sixense_clear_bindings; sixense_write_bindings jumphud/jh_mmdashboard_casual.txt"
