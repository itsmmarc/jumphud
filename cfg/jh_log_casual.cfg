// main alias
alias "jh_mode_jump"        "jh_active_config_jump; jh_mmdashboard_clear; jh_mmoverride_clear; jh_ammo_clear; jh_killstreak_clear; jh_classmenu_clear; jh_teammenu_clear; jh_scoreboard_clear; jh_mangler_clear; jh_uber_clear; jh_health_clear; jh_hudlayout_clear; jh_demopipes_clear; jh_targetid_clear; jh_attributetracker_clear;"
alias "jh_mode_casual"      "jh_speedos_off; jh_skeys_toggle_off; jh_active_config_casual; jh_mmdashboard_casual; jh_mmoverride_casual; jh_ammo_casual; jh_killstreak_casual; jh_classmenu_casual; jh_teammenu_casual; jh_scoreboard_casual; jh_mangler_casual; jh_uber_casual; jh_health_casual; jh_hudlayout_casual; jh_demopipes_casual; jh_targetid_casual; jh_attributetracker_casual;"