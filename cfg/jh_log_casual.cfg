alias "jh_scoreboard_clear"         "sixense_clear_bindings; sixense_write_bindings jumphud/jh_scoreboard_casual.txt"
alias "jh_mangler_clear"            "sixense_clear_bindings; sixense_write_bindings jumphud/jh_mangler_casual.txt"
alias "jh_uber_clear"               "sixense_clear_bindings; sixense_write_bindings jumphud/jh_uber_casual.txt"
