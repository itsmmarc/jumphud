//======================================================================================================================================================================================================================
// Make sure the time stamp is not included when printing lines
//======================================================================================================================================================================================================================
con_timestamp "0"

//======================================================================================================================================================================================================================
// Define aliases
//======================================================================================================================================================================================================================
exec jh_aliases.cfg

//======================================================================================================================================================================================================================
// Execute all customization files
//======================================================================================================================================================================================================================
exec jh_log_casual.cfg
exec jh_log_speedos.cfg
exec jh_log_extras.cfg
exec customization/jh_general.cfg
exec customization/jh_tfsettings.cfg
exec customization/jh_jumpsettings.cfg
exec customization/jh_crosshairs.cfg
exec customization/jh_speedoorder.cfg
exec customization/jh_speedos_soldier.cfg
exec customization/jh_speedos_demo.cfg
exec customization/jh_barspeedos.cfg
exec customization/jh_speedographs.cfg
exec customization/jh_fonts.cfg
exec customization/jh_resolutions.cfg
exec customization/jh_reset.cfg
exec customization/jh_shaders.cfg
exec customization/jh_pipetimer.cfg
exec customization/jh_visuals.cfg

//exec jh_dev.cfg

//======================================================================================================================================================================================================================
// Execute first HUD launch setup
//======================================================================================================================================================================================================================
alias "jh_firstrun" "exec jh_first_run"
exec jumphud/jh_setup.txt
jh_firstrun

//======================================================================================================================================================================================================================
// Execute default settings
//======================================================================================================================================================================================================================
alias dimmer_clicked ""     //Fix for general console spam
sv_cheats 1                 // enabled so speedo previews update after changes on main menu
tf_hud_target_id_disable_floating_health 1
tf_hud_target_id_alpha 175  // alpha of targetid background colour
jh_hudmessage_toggle_on     // enable map pop up text
jh_customization_submenu_clear  // clear submenus
m_yaw 0.022     // reset m_yaw incase config was deleted while in mirrorworld mode
exec jh_state.cfg
hud_reloadscheme

//======================================================================================================================================================================================================================
// Open welcome panel
//======================================================================================================================================================================================================================
alias "jh_welcome_reset" "sixense_clear_bindings; sixense_write_bindings jumphud/jh_setup_welcome.txt"  // call this to have welcome message appear on next launch
alias "jh_firstrun_welcome" "exec jh_first_run_welcome"
exec jumphud/jh_setup_welcome.txt
jh_firstrun_welcome